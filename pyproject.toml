[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clim4cast-imagegen"
version = "0.1.0"
description = "Pipeline that generates climate map images for the website"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<4",
    "geopandas",
    "matplotlib",
    "numpy",
    "pillow",
    "pyproj",
    "python-dotenv",
    "pyyaml",
    "rasterio",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["clim4cast_imagegen*"]

[project.scripts]
clim4cast-imagegen = "clim4cast_imagegen.cli:run"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"clim4cast_imagegen/core/constants.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
